[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "openrvdas-diagram"
dynamic = ["version"]
description = "Generates a data-flow diagram from OpenRVDAS logger configs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pyyaml",
    "graphviz",
]

[project.scripts]
openrvdas-diagram = "openrvdas_diagram.main:main"
openrvdas-diagram-render = "openrvdas_diagram.render_main:main"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
